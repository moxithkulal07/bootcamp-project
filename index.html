<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EV Charging Station Finder & Booking</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>⚡ EV Charging Station Finder & Booking</h1>
        <nav>
            <button class="nav-btn active" onclick="switchTab('finder-tab', this)">Finder & Booking</button>
            <button class="nav-btn" onclick="switchTab('bookings-tab', this)">My Bookings</button>
        </nav>
    </header>

    <!-- Global Notification/Message Box -->
    <div id="message-box" class="message-box"></div>

    <main class="container">

        <!-- SECTION 1: FINDER & BOOKING -->
        <section id="finder-tab" class="tab-content active">
            
            <!-- Search & Filters -->
            <div class="filter-container">
                <input type="text" id="search-input" placeholder="Search by name, location, or address..." onkeyup="filterStations()">
                
                <select id="charger-type-filter" onchange="filterStations()">
                    <option value="">All Charging Types</option>
                    <option value="CCS2 (Fast)">CCS2 (Fast)</option>
                    <option value="Type 2 (AC)">Type 2 (AC)</option>
                    <option value="GB/T (Fast)">GB/T (Fast)</option>
                </select>

                <select id="availability-filter" onchange="filterStations()">
                    <option value="">All Statuses</option>
                    <option value="Available">Available</option>
                    <option value="Busy">Busy</option>
                    <option value="Maintenance">Maintenance</option>
                </select>
            </div>

            <div class="layout">
                <!-- Station Listing -->
                <div class="panel">
                    <h2>Available Stations</h2>
                    <div id="station-list">
                        <!-- Dynamic Station Cards Inject Here -->
                    </div>
                </div>

                <!-- Booking Form -->
                <div class="panel">
                    <h2 id="form-title">Make a Charging Booking</h2>
                    <form id="booking-form" onsubmit="handleFormSubmit(event)" novalidate>
                        
                        <input type="hidden" id="editing-booking-id">

                        <div class="form-group">
                            <label>Selected Station:</label>
                            <input type="text" id="station-name" placeholder="Click 'Select Station' from the list" readonly>
                        </div>

                        <div class="form-group">
                            <label>Full Name:</label>
                            <input type="text" id="user-name" placeholder="John Doe">
                        </div>

                        <div class="form-group">
                            <label>Email Address:</label>
                            <input type="email" id="user-email" placeholder="john@example.com">
                        </div>

                        <div class="form-group">
                            <label>Contact Information (Phone):</label>
                            <input type="text" id="user-contact" placeholder="+91 9876543210">
                        </div>

                        <div class="form-group">
                            <label>Vehicle Information (Model & Number):</label>
                            <input type="text" id="vehicle-info" placeholder="Tata Nexon EV - KA 01 EQ 1234">
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label>Date:</label>
                                <input type="date" id="booking-date">
                            </div>
                            <div class="form-group">
                                <label>Time:</label>
                                <input type="time" id="booking-time">
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Other Booking Details / Notes:</label>
                            <textarea id="booking-notes" rows="2" placeholder="e.g. Need 80% fast charge"></textarea>
                        </div>

                        <button type="submit" id="submit-btn" class="btn primary-btn">Confirm Booking</button>
                        <button type="button" id="cancel-edit-btn" class="btn secondary-btn hidden" onclick="resetBookingForm()">Cancel Edit</button>
                    </form>
                </div>
            </div>
        </section>

        <!-- SECTION 2: VIEW BOOKINGS -->
        <section id="bookings-tab" class="tab-content">
            <h2>Existing Bookings</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Booking ID</th>
                            <th>Station Name</th>
                            <th>User Details</th>
                            <th>Vehicle</th>
                            <th>Date & Time</th>
                            <th>Status</th>
                            <th>Notes</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="bookings-table-body">
                        <!-- Dynamic Bookings Rows Inject Here -->
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
